<!DOCTYPE html>
<html>
<head>
    <title>Employee Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Authentication Test</h1>
        
        <div class="form-group">
            <label for="authToken">Auth Token from URL:</label>
            <input type="text" id="authToken" placeholder="Paste the auth parameter value here">
        </div>
        
        <div class="form-group">
            <label for="employeeId">Employee ID (parsed):</label>
            <input type="text" id="employeeId" readonly>
        </div>
        
        <div class="form-group">
            <label for="accessToken">Access Token (parsed):</label>
            <input type="text" id="accessToken" readonly>
        </div>
        
        <button onclick="parseToken()">Parse Token</button>
        <button onclick="testAuth()">Test Authentication</button>
        <button onclick="listEmployees()">List All Employees</button>
        
        <div id="result"></div>
    </div>

    <script>
        // Parse the auth token
        function parseToken() {
            const authToken = document.getElementById('authToken').value;
            if (!authToken) {
                showResult('Please enter an auth token', 'error');
                return;
            }
            
            const tokenParts = authToken.split('_');
            console.log('Token parts:', tokenParts);
            
            if (tokenParts.length < 2) {
                showResult('Invalid token format', 'error');
                return;
            }
            
            let employeeId, token;
            
            // Try to determine employee ID and token
            if (tokenParts.length === 2) {
                employeeId = tokenParts[0];
                token = tokenParts[1];
            } else if (tokenParts.length >= 3) {
                // If first part is short, it might be a prefix
                if (tokenParts[0].length < 5) {
                    employeeId = `${tokenParts[0]}_${tokenParts[1]}`;
                    token = tokenParts.slice(2).join('_');
                } else {
                    // Otherwise, use first part as ID
                    employeeId = tokenParts[0];
                    token = tokenParts.slice(1).join('_');
                }
            }
            
            document.getElementById('employeeId').value = employeeId;
            document.getElementById('accessToken').value = token;
            
            showResult(`Parsed successfully!<br>Employee ID: ${employeeId}<br>Access Token: ${token.substring(0, 20)}...`, 'success');
        }
        
        // Test authentication
        async function testAuth() {
            const employeeId = document.getElementById('employeeId').value;
            const accessToken = document.getElementById('accessToken').value;
            
            if (!employeeId || !accessToken) {
                showResult('Please parse the token first', 'error');
                return;
            }
            
            showResult('Testing authentication...', 'success');
            
            try {
                // This would need to be implemented with your actual SDK
                showResult('Authentication test would run here with your SDK', 'success');
            } catch (error) {
                showResult('Error: ' + error.message, 'error');
            }
        }
        
        // List employees
        async function listEmployees() {
            showResult('Listing employees would run here with your SDK', 'success');
        }
        
        // Show result
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result ${type}">${message}</div>`;
        }
        
        // Auto-parse if token is in URL
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authParam = urlParams.get('auth');
            if (authParam) {
                document.getElementById('authToken').value = authParam;
                parseToken();
            }
        };
    </script>
</body>
</html>
